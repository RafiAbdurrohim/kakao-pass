<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38241B" />
      <stop offset="100%" stop-color="#1E120D" />
    </linearGradient>

    <!-- Warm Cocoa Caramel Gradient -->
    <linearGradient id="caramelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1BE" />
      <stop offset="100%" stop-color="#E0A364" />
    </linearGradient>

    <!-- Botanical Sprout Leaf Gradient -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E7C3B" />
      <stop offset="100%" stop-color="#80DF94" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Cocoa Edge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="114" stroke="#543A2C" stroke-width="8" stroke-opacity="0.75" />

  <!-- Inner Brand Badge: QR Passport + Cocoa Pod Sprout -->
  <g filter="url(#subtleGlow)" transform="translate(68, 68)">
    <!-- 1. Top-Left QR Finder Pattern -->
    <rect x="0" y="0" width="132" height="132" rx="34" fill="#FFF8EC" />
    <rect x="22" y="22" width="88" height="88" rx="20" fill="#241610" />
    <rect x="42" y="42" width="48" height="48" rx="12" fill="url(#caramelGrad)" />

    <!-- 2. Bottom-Left QR Finder Pattern -->
    <rect x="0" y="244" width="132" height="132" rx="34" fill="#FFF8EC" />
    <rect x="22" y="266" width="88" height="88" rx="20" fill="#241610" />
    <rect x="42" y="286" width="48" height="48" rx="12" fill="url(#caramelGrad)" />

    <!-- 3. Top-Right QR Finder with Botanical Sprout Accent -->
    <rect x="244" y="0" width="132" height="132" rx="34" fill="#FFF8EC" />
    <rect x="266" y="22" width="88" height="88" rx="20" fill="#241610" />
    <rect x="286" y="42" width="48" height="48" rx="12" fill="url(#sproutGrad)" />

    <!-- 4. Center & Bottom-Right: Cocoa Bean Silhouette & Data Bits -->
    <!-- Cocoa Pod Curve in the center -->
    <path
      d="M166 188 C176 138 214 116 238 126 C262 136 280 186 268 238 C256 290 216 312 192 302 C168 292 156 238 166 188 Z"
      fill="url(#caramelGrad)"
    />
    <!-- Pod center vein -->
    <path
      d="M174 192 Q218 214 260 234"
      stroke="#241610"
      stroke-width="7"
      stroke-linecap="round"
      opacity="0.4"
    />

    <!-- Small fresh leaf sprouting on top of center bean -->
    <path
      d="M236 128 C248 94 282 86 296 96 C308 106 300 138 266 142 C248 144 240 136 236 128 Z"
      fill="url(#sproutGrad)"
    />

    <!-- Digital QR matrix blocks around the bean -->
    <rect x="166" y="32" width="42" height="42" rx="12" fill="#FFF8EC" />
    <rect x="32" y="166" width="42" height="42" rx="12" fill="#FFF8EC" />
    <rect x="94" y="166" width="42" height="42" rx="12" fill="url(#caramelGrad)" />
    
    <rect x="244" y="244" width="44" height="44" rx="12" fill="#FFF8EC" />
    <rect x="312" y="244" width="64" height="44" rx="12" fill="url(#sproutGrad)" />
    <rect x="244" y="312" width="64" height="64" rx="18" fill="url(#caramelGrad)" />
    <rect x="332" y="312" width="44" height="64" rx="14" fill="#FFF8EC" />
  </g>
</svg>
